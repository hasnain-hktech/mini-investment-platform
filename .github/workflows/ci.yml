name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-user-service:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: core/user-service

    steps:
      # your turn:
      # 1. checkout the code
      # 2. setup node 22
      # 3. install dependencies
      # 4. run tests
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
